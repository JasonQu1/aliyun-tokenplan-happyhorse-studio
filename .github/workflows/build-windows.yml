name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Run tests
        run: python -m unittest -v test_server.py
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Build single-file EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name HappyHorseStudio --add-data "web:web" server.py
      - name: Package
        shell: pwsh
        run: |
          $digest = (Get-FileHash dist/HappyHorseStudio.exe -Algorithm SHA256).Hash.ToLower()
          "$digest  HappyHorseStudio.exe" | Set-Content dist/SHA256.txt -Encoding ascii
          Compress-Archive -Path dist/HappyHorseStudio.exe,dist/SHA256.txt -DestinationPath dist/HappyHorseStudio-Windows-x64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: HappyHorseStudio-Windows-x64
          path: dist/HappyHorseStudio-Windows-x64.zip
          if-no-files-found: error
